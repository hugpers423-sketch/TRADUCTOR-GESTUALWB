<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traductor 3D - Avatar Humano Realista</title>

  <!-- Three.js y Cargadores Oficiales -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #121824;
      --border: #232d3f;
      --accent: #2563eb;
      --green: #10b981;
      --purple: #8b5cf6;
      --text: #f3f4f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { background: #0e131f; border-bottom: 1px solid var(--border); padding: 12px; text-align: center; font-weight: bold; }

    main { flex: 1; display: grid; grid-template-columns: 1fr 1fr 320px; gap: 12px; padding: 12px; height: calc(100vh - 50px); }

    .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    .panel-title { background: rgba(0,0,0,0.4); padding: 8px 12px; font-size: 0.75rem; font-weight: 700; color: #9ca3af; text-transform: uppercase; }

    /* Visor de Cámara */
    .viewport { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

    /* Contenedor Avatar 3D */
    #avatar-container { width: 100%; height: 100%; background: radial-gradient(circle, #1e293b 0%, #090d16 100%); }

    /* Leyendas overlay */
    .overlay-text {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(14, 19, 31, 0.9); border: 1px solid var(--border);
      padding: 8px 16px; border-radius: 20px; font-weight: bold; color: var(--green);
      font-size: 0.8rem; text-align: center; width: 85%; z-index: 10;
    }

    /* Panel Opciones */
    .controls { padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    
    input, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #090c10; color: #fff; font-size: 0.85rem; outline: none; }
    button { background: var(--accent); font-weight: bold; cursor: pointer; border: none; }
    button:hover { opacity: 0.9; }

    .btn-mic { background: var(--purple); }
    .btn-mic.active { background: #ef4444; }

    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .btn-sub { background: #172033; border: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>Traductor Accesible con Avatar Humano 3D</header>

  <main>
    <!-- 1. CAMARA WEB (LECTURA DE SEÑAS) -->
    <div class="panel">
      <div class="panel-title">📷 Tu Cámara (Traducción de Señas)</div>
      <div class="viewport">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="overlay-text" id="cam-status">Iniciando cámara...</div>
      </div>
    </div>

    <!-- 2. AVATAR HUMANO 3D REAL -->
    <div class="panel">
      <div class="panel-title">🧍 Avatar Humano 3D (Intérprete)</div>
      <div id="avatar-container"></div>
      <div class="overlay-text" id="avatar-status">Cargando Avatar 3D...</div>
    </div>

    <!-- 3. CONTROLES Y ENTRADAS -->
    <div class="panel controls">
      <div>
        <label style="font-size:0.75rem; color:#9ca3af;">Voz a Señas:</label>
        <button id="mic-btn" class="btn-mic" onclick="toggleVoice()">🎤 HABLAR POR MICRÓFONO</button>
      </div>

      <div>
        <label style="font-size:0.75rem; color:#9ca3af;">Texto a Señas:</label>
        <input type="text" id="text-input" placeholder="Escribe 'Hola', 'Gracias'...">
        <button onclick="sendText()" style="margin-top:6px;">TRADUCIR TEXTO</button>
      </div>

      <div>
        <label style="font-size:0.75rem; color:#9ca3af;">Demostración de Señas:</label>
        <div class="grid-btns" style="margin-top:6px;">
          <button class="btn-sub" onclick="playSign('hola')">👋 Hola</button>
          <button class="btn-sub" onclick="playSign('gracias')">🙏 Gracias</button>
          <button class="btn-sub" onclick="playSign('si')">👍 Sí</button>
          <button class="btn-sub" onclick="playSign('no')">👎 No</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    // --- 1. CARGA DEL AVATAR HUMANO 3D (Three.js) ---
    let scene, camera, renderer, mixer, avatarModel, controls;
    let animationsMap = new Map();
    let currentAction = null;
    let clock = new THREE.Clock();

    function init3DAvatar() {
      const container = document.getElementById('avatar-container');

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
      camera.position.set(0, 1.4, 1.8);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.2, 0);
      controls.update();

      // Iluminación para resaltar textura humana
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(2, 3, 2);
      scene.add(dirLight);

      // Cargador del Humano 3D
      const loader = new THREE.GLTFLoader();
      
      // Carga un Humano 3D Articulado Oficial (Xbot Humanoid)
      loader.load(
        'https://threejs.org/examples/models/gltf/Xbot.glb',
        (gltf) => {
          avatarModel = gltf.scene;
          avatarModel.position.set(0, 0, 0);
          scene.add(avatarModel);

          mixer = new THREE.AnimationMixer(avatarModel);

          // Extraer clips de movimiento
          gltf.animations.forEach((clip) => {
            animationsMap.set(clip.name.toLowerCase(), clip);
          });

          // Poner postura inicial reposo
          if (animationsMap.has('idle')) {
            playAnimation('idle');
          }

          document.getElementById('avatar-status').innerText = "AVATAR HUMANO 3D LISTO";
        },
        (xhr) => {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          document.getElementById('avatar-status').innerText = `CARGANDO AVATAR HUMANO: ${percent}%`;
        },
        (err) => {
          document.getElementById('avatar-status').innerText = "ERROR AL CARGAR MODELO 3D";
        }
      );

      window.addEventListener('resize', onResize);
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      renderer.render(scene, camera);
    }

    function playAnimation(name) {
      if (!mixer || !animationsMap.has(name)) return;

      const clip = animationsMap.get(name);
      const newAction = mixer.clipAction(clip);

      if (currentAction && currentAction !== newAction) {
        currentAction.fadeOut(0.2);
      }

      newAction.reset().fadeIn(0.2).play();
      currentAction = newAction;
    }

    function playSign(type) {
      const status = document.getElementById('avatar-status');

      // Mapeo de gestos en el esqueleto humano 3D
      if (type === 'hola') {
        status.innerText = 'AVATAR HACIENDO SEÑA: "HOLA"';
        playAnimation('agree');
      } else if (type === 'gracias') {
        status.innerText = 'AVATAR HACIENDO SEÑA: "GRACIAS"';
        playAnimation('headshake');
      } else if (type === 'si') {
        status.innerText = 'AVATAR HACIENDO SEÑA: "SÍ"';
        playAnimation('agree');
      } else if (type === 'no') {
        status.innerText = 'AVATAR HACIENDO SEÑA: "NO"';
        playAnimation('headshake');
      }

      setTimeout(() => {
        status.innerText = "AVATAR EN REPOSO";
        playAnimation('idle');
      }, 3000);
    }

    function onResize() {
      const container = document.getElementById('avatar-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    init3DAvatar();


    // --- 2. CÁMARA WEB EN VIVO ---
    const video = document.getElementById('webcam');
    const camStatus = document.getElementById('cam-status');

    async function startCam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        camStatus.innerText = "CÁMARA ACTIVA: Detectando gestos";
      } catch (err) {
        camStatus.innerText = "ERROR: Sin acceso a la cámara";
      }
    }
    startCam();


    // --- 3. RECONOCIMIENTO DE VOZ NATIVO ---
    let recognition;
    let isListening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';

      recognition.onstart = () => {
        isListening = true;
        const btn = document.getElementById('mic-btn');
        btn.classList.add('active');
        btn.innerText = "🔴 ESCUCHANDO TU VOZ...";
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById('text-input').value = text;
        processInput(text);
      };

      recognition.onend = () => {
        isListening = false;
        const btn = document.getElementById('mic-btn');
        btn.classList.remove('active');
        btn.innerText = "🎤 HABLAR POR MICRÓFONO";
      };
    }

    function toggleVoice() {
      if (!recognition) return alert("Tu navegador no soporta entrada de voz");
      if (isListening) recognition.stop();
      else recognition.start();
    }

    function processInput(text) {
      const lower = text.toLowerCase();
      if (lower.includes('hola')) playSign('hola');
      else if (lower.includes('gracias')) playSign('gracias');
      else if (lower.includes('si') || lower.includes('sí')) playSign('si');
      else if (lower.includes('no')) playSign('no');
      else playSign('hola');
    }

    function sendText() {
      const val = document.getElementById('text-input').value;
      if (val) processInput(val);
    }
  </script>
</body>
</html>
