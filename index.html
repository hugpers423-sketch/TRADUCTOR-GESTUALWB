<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Humano 3D Intérprete - Lengua de Señas</title>

  <!-- Three.js + GLTFLoader + OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    :root {
      --bg-primary: #090d16;
      --bg-card: #121824;
      --border-color: #232d3f;
      --accent-blue: #2563eb;
      --accent-green: #10b981;
      --text-main: #f3f4f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header {
      background: #0e131f; border-bottom: 1px solid var(--border-color);
      padding: 14px 24px; text-align: center;
    }
    header h1 { font-size: 1.3rem; font-weight: 700; color: #fff; }

    main {
      flex: 1; display: grid; grid-template-columns: 1fr 360px; gap: 20px; padding: 20px; max-width: 1500px; margin: 0 auto; width: 100%;
    }

    .avatar-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; position: relative;
    }

    #avatar-container { width: 100%; height: 100%; min-height: 400px; background: radial-gradient(circle, #1e293b 0%, #090d16 100%); }

    .subtitle-overlay {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(14, 19, 31, 0.9); border: 1px solid var(--border-color);
      padding: 12px 28px; border-radius: 30px; font-weight: 700; color: #34d399;
      backdrop-filter: blur(8px); text-align: center; width: 75%; font-size: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .controls-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 18px;
    }

    .control-group { display: flex; flex-direction: column; gap: 8px; }
    .control-group label { font-size: 0.85rem; color: #9ca3af; font-weight: 600; text-transform: uppercase; }

    input, button {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);
      background: #090c10; color: #fff; font-size: 0.95rem; outline: none;
    }

    button { background: var(--accent-blue); border: none; font-weight: 700; cursor: pointer; transition: 0.2s; }
    button:hover { background: #1d4ed8; }

    .dictionary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .dict-btn { background: #172033; border: 1px solid var(--border-color); padding: 12px; font-size: 0.85rem; }
    .dict-btn:hover { background: var(--accent-blue); }
  </style>
</head>
<body>

  <header>
    <h1>Intérprete Humano 3D - Lengua de Señas</h1>
  </header>

  <main>
    <div class="avatar-card">
      <div id="avatar-container"></div>
      <div class="subtitle-overlay" id="subtitles">CARGANDO AVATAR HUMANO...</div>
    </div>

    <div class="controls-card">
      <div class="control-group">
        <label>Traducción de Texto a Señas:</label>
        <input type="text" id="text-input" placeholder="Escribe 'Hola', 'Gracias'...">
        <button onclick="interpretText()">TRADUCIR</button>
      </div>

      <div class="control-group">
        <label>Catálogo de Señas:</label>
        <div class="dictionary-grid">
          <button class="dict-btn" onclick="playAnimation('hola')">👋 HOLA</button>
          <button class="dict-btn" onclick="playAnimation('saludo')">🧍 SALUDAR</button>
          <button class="dict-btn" onclick="playAnimation('caminar')">🚶 MOVERSE</button>
          <button class="dict-btn" onclick="playAnimation('reposo')">🛑 REPOSO</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    let scene, camera, renderer, mixer, controls;
    let animationsMap = new Map();
    let currentAction = null;
    let clock = new THREE.Clock();

    init();

    function init() {
      const container = document.getElementById('avatar-container');

      // Escena
      scene = new THREE.Scene();

      // Cámara enfocada al torso/rostro del humano
      camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);
      camera.position.set(0, 1.35, 1.8);

      // Renderizador con mapeo de color realista
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      container.appendChild(renderer.domElement);

      // Control de cámara con ratón/touch
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enablePan = false;
      controls.target.set(0, 1.2, 0);
      controls.update();

      // Luces de estudio fotográfico
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
      mainLight.position.set(1.5, 3, 2);
      scene.add(mainLight);

      const fillLight = new THREE.DirectionalLight(0x90e0ef, 0.5);
      fillLight.position.set(-1.5, 2, -1);
      scene.add(fillLight);

      // Cargar Avatar Humanoid Realista (GLTF)
      const loader = new THREE.GLTFLoader();
      
      // Modelo humano completo
      loader.load('https://threejs.org/examples/models/gltf/Xbot.glb', 
        (gltf) => {
          const avatarModel = gltf.scene;
          avatarModel.position.set(0, 0, 0);
          avatarModel.scale.set(1, 1, 1);
          scene.add(avatarModel);

          // Inicializar motor de huesos/animaciones
          mixer = new THREE.AnimationMixer(avatarModel);

          gltf.animations.forEach((clip) => {
            animationsMap.set(clip.name.toLowerCase(), clip);
          });

          // Animación por defecto (Idle Humano)
          if (animationsMap.has('idle')) {
            playAnimationDirect('idle');
          }

          document.getElementById('subtitles').innerText = "AVATAR HUMANO LISTO";
        },
        (xhr) => {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          document.getElementById('subtitles').innerText = `CARGANDO HUMANO 3D: ${percent}%`;
        },
        (error) => {
          console.error("Error al cargar avatar humano:", error);
          document.getElementById('subtitles').innerText = "ERROR AL CARGAR MODELO HUMANO";
        }
      );

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      renderer.render(scene, camera);
    }

    function playAnimationDirect(name) {
      if (!mixer || !animationsMap.has(name)) return;

      const clip = animationsMap.get(name);
      const newAction = mixer.clipAction(clip);

      if (currentAction && currentAction !== newAction) {
        currentAction.fadeOut(0.25);
      }

      newAction.reset().fadeIn(0.25).play();
      currentAction = newAction;
    }

    function playAnimation(key) {
      const subtitles = document.getElementById('subtitles');

      const map = {
        'hola': 'agree',
        'saludo': 'headshake',
        'caminar': 'walk',
        'reposo': 'idle'
      };

      const targetAnim = map[key] || 'idle';

      if (animationsMap.has(targetAnim)) {
        subtitles.innerText = `EJECUTANDO SEÑA: "${key.toUpperCase()}"`;
        playAnimationDirect(targetAnim);
      }
    }

    function interpretText() {
      const input = document.getElementById('text-input').value.trim().toLowerCase();
      if (!input) return;

      if (input.includes('hola')) playAnimation('hola');
      else if (input.includes('saludo') || input.includes('buenas')) playAnimation('saludo');
      else playAnimation('caminar');
    }

    function onWindowResize() {
      const container = document.getElementById('avatar-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }
  </script>
</body>
</html>
