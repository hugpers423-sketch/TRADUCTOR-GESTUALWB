<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traductor Bidireccional Accesible - Señas, Texto y Audio</title>

  <!-- Three.js + GLTFLoader + OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- MediaPipe Hands & Camera -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-primary: #090d16;
      --bg-card: #121824;
      --border-color: #232d3f;
      --accent-blue: #2563eb;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-purple: #8b5cf6;
      --text-main: #f3f4f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header {
      background: #0e131f; border-bottom: 1px solid var(--border-color);
      padding: 12px 24px; text-align: center; display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 1.2rem; font-weight: 700; color: #fff; }
    .badge { background: var(--accent-green); color: #000; padding: 4px 12px; border-radius: 12px; font-weight: 700; font-size: 0.75rem; }

    main {
      flex: 1; display: grid; grid-template-columns: 1fr 1fr 340px; gap: 16px; padding: 16px; max-width: 1800px; margin: 0 auto; width: 100%; height: calc(100vh - 60px);
    }

    .panel-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; position: relative;
    }

    .panel-header {
      background: rgba(0,0,0,0.3); padding: 10px 16px; font-size: 0.8rem; font-weight: 700;
      border-bottom: 1px solid var(--border-color); text-transform: uppercase; color: #9ca3af;
    }

    /* Modulo Cámara */
    .camera-wrapper { position: relative; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; }
    video { display: none; }
    canvas#output-canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

    /* Modulo Avatar 3D */
    #avatar-container { width: 100%; height: 100%; background: radial-gradient(circle, #1e293b 0%, #090d16 100%); }

    /* Subtítulos Overlay */
    .subtitle-overlay {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(14, 19, 31, 0.9); border: 1px solid var(--border-color);
      padding: 10px 20px; border-radius: 20px; font-weight: 700; color: #34d399;
      backdrop-filter: blur(8px); text-align: center; width: 85%; font-size: 0.85rem; z-index: 10;
    }

    /* Panel de Opciones y Control de Audio */
    .controls-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto;
    }

    .control-group { display: flex; flex-direction: column; gap: 8px; }
    .control-group label { font-size: 0.8rem; color: #9ca3af; font-weight: 600; text-transform: uppercase; }

    input, button {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);
      background: #090c10; color: #fff; font-size: 0.9rem; outline: none;
    }

    button { background: var(--accent-blue); border: none; font-weight: 700; cursor: pointer; transition: 0.2s; }
    button:hover { background: #1d4ed8; }

    .btn-mic { background: var(--accent-purple); display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-mic.recording { background: var(--accent-red); animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .dictionary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .dict-btn { background: #172033; border: 1px solid var(--border-color); padding: 10px; font-size: 0.8rem; text-align: center; }
    .dict-btn:hover { background: var(--accent-purple); }

    .speed-controls { display: flex; gap: 8px; }
    .speed-btn { background: #1a2333; border: 1px solid var(--border-color); padding: 6px; font-size: 0.75rem; }
    .speed-btn.active { background: var(--accent-blue); }
  </style>
</head>
<body>

  <header>
    <h1>Traductor Accesible Bidireccional (Señas ↔ Audio/Texto)</h1>
    <span class="badge">SISTEMA ACTIVO</span>
  </header>

  <main>
    <!-- PANEL 1: CÁMARA (INTERPRETA SEÑAS Y MUESTRA TEXTO TRADUCIDO) -->
    <div class="panel-card">
      <div class="panel-header">📷 Visor Cámara (Traduce tus Señas a Texto)</div>
      <div class="camera-wrapper">
        <video id="webcam" playsinline></video>
        <canvas id="output-canvas"></canvas>
      </div>
      <div class="subtitle-overlay" id="cam-status">TEXTO TRADUCIDO: Esperando señas...</div>
    </div>

    <!-- PANEL 2: AVATAR HUMANO 3D (RECIBE AUDIO/TEXTO Y TRADUCE A SEÑAS) -->
    <div class="panel-card">
      <div class="panel-header">🧍 Avatar Humano 3D (Traductor a Señas)</div>
      <div id="avatar-container"></div>
      <div class="subtitle-overlay" id="avatar-status">AVATAR EN REPOSO</div>
    </div>

    <!-- PANEL 3: ENTRADAS DE AUDIO, TEXTO Y CONFIGURACIÓN -->
    <div class="controls-card">
      
      <!-- Entrada por Micrófono / Voz -->
      <div class="control-group">
        <label>Enviar Voz para Traducir a Señas:</label>
        <button id="mic-btn" class="btn-mic" onclick="toggleVoiceRecognition()">
          🎤 HABLAR POR MICRÓFONO
        </button>
      </div>

      <!-- Entrada por Texto -->
      <div class="control-group">
        <label>Escribir Texto para Traducir:</label>
        <input type="text" id="text-input" placeholder="Escribe 'Hola', 'Gracias'...">
        <button onclick="interpretText()">ENVIAR TEXTO</button>
      </div>

      <!-- Velocidad del Avatar -->
      <div class="control-group">
        <label>Velocidad del Avatar:</label>
        <div class="speed-controls">
          <button class="speed-btn" onclick="setSpeed(0.5)">0.5x</button>
          <button class="speed-btn active" onclick="setSpeed(1.0)">1.0x</button>
          <button class="speed-btn" onclick="setSpeed(1.5)">1.5x</button>
        </div>
      </div>

      <!-- Diccionario de Accesibilidad Rápida -->
      <div class="control-group">
        <label>Catálogo de Señas Rápidas:</label>
        <div class="dictionary-grid">
          <button class="dict-btn" onclick="playAnimation('hola')">👋 Hola</button>
          <button class="dict-btn" onclick="playAnimation('gracias')">🙏 Gracias</button>
          <button class="dict-btn" onclick="playAnimation('si')">👍 Sí</button>
          <button class="dict-btn" onclick="playAnimation('no')">👎 No</button>
          <button class="dict-btn" onclick="playAnimation('saludo')">🧍 Saludar</button>
          <button class="dict-btn" onclick="playAnimation('caminar')">🚶 Moverse</button>
        </div>
      </div>

    </div>
  </main>

  <script>
    // Variables Three.js
    let scene, camera, renderer, mixer, controls;
    let animationsMap = new Map();
    let currentAction = null;
    let clock = new THREE.Clock();
    let animationSpeed = 1.0;

    // Variables Cámara
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const camStatus = document.getElementById('cam-status');
    const avatarStatus = document.getElementById('avatar-status');

    // Variables Reconocimiento de Voz
    let recognition = null;
    let isListening = false;

    init3DAvatar();
    initCameraRecognition();
    initVoiceRecognition();

    // --- 1. VISOR AVATAR HUMANO 3D ---
    function init3DAvatar() {
      const container = document.getElementById('avatar-container');

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);
      camera.position.set(0, 1.35, 1.8);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enablePan = false;
      controls.target.set(0, 1.2, 0);
      controls.update();

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
      mainLight.position.set(1.5, 3, 2);
      scene.add(mainLight);

      const loader = new THREE.GLTFLoader();
      loader.load('https://threejs.org/examples/models/gltf/Xbot.glb', 
        (gltf) => {
          const avatarModel = gltf.scene;
          avatarModel.position.set(0, 0, 0);
          scene.add(avatarModel);

          mixer = new THREE.AnimationMixer(avatarModel);
          gltf.animations.forEach((clip) => {
            animationsMap.set(clip.name.toLowerCase(), clip);
          });

          if (animationsMap.has('idle')) playAnimationDirect('idle');
          avatarStatus.innerText = "AVATAR HUMANO LISTO";
        }
      );

      window.addEventListener('resize', onWindowResize);
      animate3D();
    }

    function animate3D() {
      requestAnimationFrame(animate3D);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta * animationSpeed);
      renderer.render(scene, camera);
    }

    function playAnimationDirect(name) {
      if (!mixer || !animationsMap.has(name)) return;
      const clip = animationsMap.get(name);
      const newAction = mixer.clipAction(clip);
      if (currentAction && currentAction !== newAction) currentAction.fadeOut(0.2);
      newAction.reset().fadeIn(0.2).play();
      currentAction = newAction;
    }

    function playAnimation(key) {
      const map = {
        'hola': 'agree',
        'gracias': 'headshake',
        'si': 'agree',
        'no': 'headshake',
        'saludo': 'agree',
        'caminar': 'walk',
        'reposo': 'idle'
      };

      const targetAnim = map[key] || 'idle';
      if (animationsMap.has(targetAnim)) {
        avatarStatus.innerText = `AVATAR HACIENDO SEÑA: "${key.toUpperCase()}"`;
        playAnimationDirect(targetAnim);
      }
    }

    function processTextOrAudio(phrase) {
      const input = phrase.toLowerCase().trim();
      if (!input) return;

      avatarStatus.innerText = `AUDIO/TEXTO RECIBIDO: "${input.toUpperCase()}"`;

      if (input.includes('hola')) playAnimation('hola');
      else if (input.includes('gracias')) playAnimation('gracias');
      else if (input.includes('si') || input.includes('sí')) playAnimation('si');
      else if (input.includes('no')) playAnimation('no');
      else playAnimation('caminar');
    }

    function interpretText() {
      const val = document.getElementById('text-input').value;
      processTextOrAudio(val);
    }

    // --- 2. RECONOCIMIENTO DE AUDIO POR MICRÓFONO ---
    function initVoiceRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        document.getElementById('mic-btn').innerText = "🎤 MICRÓFONO NO COMPATIBLE";
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        const btn = document.getElementById('mic-btn');
        btn.classList.add('recording');
        btn.innerText = "🔴 ESCUCHANDO AUDIO...";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('text-input').value = transcript;
        processTextOrAudio(transcript);
      };

      recognition.onerror = () => stopListening();
      recognition.onend = () => stopListening();
    }

    function toggleVoiceRecognition() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function stopListening() {
      isListening = false;
      const btn = document.getElementById('mic-btn');
      btn.classList.remove('recording');
      btn.innerText = "🎤 HABLAR POR MICRÓFONO";
    }

    function setSpeed(speed) {
      animationSpeed = speed;
      document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    // --- 3. RECONOCIMIENTO DE SEÑAS POR CÁMARA ---
    function initCameraRecognition() {
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
      });

      hands.onResults(onHandResults);

      const cameraMediaPipe = new Camera(videoElement, {
        onFrame: async () => { await hands.send({ image: videoElement }); },
        width: 640, height: 480
      });

      cameraMediaPipe.start()
        .then(() => camStatus.innerText = "CÁMARA ACTIVA: Muestra tus señas")
        .catch(() => camStatus.innerText = "ERROR DE CÁMARA");
    }

    function onHandResults(results) {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        for (const landmarks of results.multiHandLandmarks) {
          drawHandMesh(landmarks);
          analyzeSign(landmarks);
        }
      } else {
        camStatus.innerText = "ESPERANDO SEÑAS EN CÁMARA...";
      }
      canvasCtx.restore();
    }

    function drawHandMesh(landmarks) {
      canvasCtx.fillStyle = '#10b981';
      for (const point of landmarks) {
        const x = point.x * canvasElement.width;
        const y = point.y * canvasElement.height;
        canvasCtx.beginPath();
        canvasCtx.arc(x, y, 4, 0, 2 * Math.PI);
        canvasCtx.fill();
      }
    }

    function analyzeSign(landmarks) {
      const indexTip = landmarks[8];
      const wrist = landmarks[0];

      if (indexTip.y < wrist.y - 0.2) {
        // Muestra en texto sobre la cámara la traducción de la seña hecha por el usuario
        camStatus.innerText = 'TRADUCCIÓN SEÑA: "HOLA / SALUDO"';
      } else {
        camStatus.innerText = "MANO DETECTADA EN CÁMARA";
      }
    }

    function onWindowResize() {
      const container = document.getElementById('avatar-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }
  </script>
</body>
</html>
