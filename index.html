<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Bidireccional - Avatar 3D e Intérprete por Cámara</title>

  <!-- Three.js + GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- MediaPipe Hands & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-primary: #090d16;
      --bg-card: #121824;
      --border-color: #232d3f;
      --accent-blue: #2563eb;
      --accent-green: #10b981;
      --text-main: #f3f4f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header {
      background: #0e131f; border-bottom: 1px solid var(--border-color);
      padding: 12px 24px; text-align: center;
    }
    header h1 { font-size: 1.2rem; font-weight: 700; color: #fff; }

    main {
      flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; max-width: 1600px; margin: 0 auto; width: 100%; height: calc(100vh - 60px);
    }

    .panel-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; position: relative;
    }

    .panel-header {
      background: rgba(0,0,0,0.3); padding: 10px 16px; font-size: 0.85rem; font-weight: 700;
      border-bottom: 1px solid var(--border-color); text-transform: uppercase; color: #9ca3af;
    }

    #avatar-container { width: 100%; height: 100%; background: radial-gradient(circle, #1e293b 0%, #090d16 100%); }

    .camera-wrapper { position: relative; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; }
    video { display: none; }
    canvas#output-canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

    .subtitle-overlay {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(14, 19, 31, 0.9); border: 1px solid var(--border-color);
      padding: 10px 20px; border-radius: 20px; font-weight: 700; color: #34d399;
      backdrop-filter: blur(8px); text-align: center; width: 85%; font-size: 0.9rem; z-index: 10;
    }

    .controls-overlay {
      position: absolute; top: 50px; right: 16px; display: flex; gap: 8px; z-index: 10;
    }

    .btn-sm {
      background: var(--accent-blue); border: none; color: #fff; padding: 8px 12px;
      border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.8rem;
    }
    .btn-sm:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <header>
    <h1>Traductor Bidireccional: Reconocimiento por Cámara & Avatar 3D</h1>
  </header>

  <main>
    <!-- PANEL IZQUIERDO: RECONOCIMIENTO POR CÁMARA WEB -->
    <div class="panel-card">
      <div class="panel-header">📷 Entrada: Tu Cámara (Lector de Señas)</div>
      <div class="camera-wrapper">
        <video id="webcam" playsinline></video>
        <canvas id="output-canvas"></canvas>
      </div>
      <div class="subtitle-overlay" id="cam-status">INICIALIZANDO CÁMARA Y MEDIAPIPE...</div>
    </div>

    <!-- PANEL DERECHO: AVATAR HUMANO 3D -->
    <div class="panel-card">
      <div class="panel-header">🧍 Salida: Avatar Humano 3D (Traductor)</div>
      <div id="avatar-container"></div>
      <div class="controls-overlay">
        <button class="btn-sm" onclick="playAnimation('hola')">Probar "Hola"</button>
        <button class="btn-sm" onclick="playAnimation('gracias')">Probar "Gracias"</button>
      </div>
      <div class="subtitle-overlay" id="avatar-status">AVATAR EN REPOSO</div>
    </div>
  </main>

  <script>
    // Variables Three.js
    let scene, camera, renderer, mixer;
    let animationsMap = new Map();
    let currentAction = null;
    let clock = new THREE.Clock();

    // Variables Cámara y MediaPipe
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const camStatus = document.getElementById('cam-status');
    const avatarStatus = document.getElementById('avatar-status');

    init3DAvatar();
    initCameraRecognition();

    // --- 1. CONFIGURACIÓN DEL AVATAR HUMANO 3D ---
    function init3DAvatar() {
      const container = document.getElementById('avatar-container');

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);
      camera.position.set(0, 1.35, 1.8);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
      mainLight.position.set(1.5, 3, 2);
      scene.add(mainLight);

      // Cargar Modelo Humanoide
      const loader = new THREE.GLTFLoader();
      loader.load('https://threejs.org/examples/models/gltf/Xbot.glb', 
        (gltf) => {
          const avatarModel = gltf.scene;
          avatarModel.position.set(0, 0, 0);
          scene.add(avatarModel);

          mixer = new THREE.AnimationMixer(avatarModel);
          gltf.animations.forEach((clip) => {
            animationsMap.set(clip.name.toLowerCase(), clip);
          });

          if (animationsMap.has('idle')) playAnimationDirect('idle');
          avatarStatus.innerText = "AVATAR HUMANO LISTO";
        }
      );

      window.addEventListener('resize', onWindowResize);
      animate3D();
    }

    function animate3D() {
      requestAnimationFrame(animate3D);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      renderer.render(scene, camera);
    }

    function playAnimationDirect(name) {
      if (!mixer || !animationsMap.has(name)) return;
      const clip = animationsMap.get(name);
      const newAction = mixer.clipAction(clip);
      if (currentAction && currentAction !== newAction) currentAction.fadeOut(0.2);
      newAction.reset().fadeIn(0.2).play();
      currentAction = newAction;
    }

    function playAnimation(key) {
      const map = { 'hola': 'agree', 'gracias': 'headshake', 'idle': 'idle' };
      const targetAnim = map[key] || 'idle';
      if (animationsMap.has(targetAnim)) {
        avatarStatus.innerText = `AVATAR HACIENDO SEÑA: "${key.toUpperCase()}"`;
        playAnimationDirect(targetAnim);
      }
    }

    // --- 2. CONFIGURACIÓN DE LA CÁMARA Y RECONOCIMIENTO DE MANOS ---
    function initCameraRecognition() {
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
      });

      hands.onResults(onHandResults);

      const cameraMediaPipe = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 640,
        height: 480
      });

      cameraMediaPipe.start()
        .then(() => camStatus.innerText = "CÁMARA ACTIVA: MUESTRA TU MANO")
        .catch(err => camStatus.innerText = "ERROR AL ACCEDER A LA CÁMARA");
    }

    // Lógica para procesar lo que ve la cámara
    function onHandResults(results) {
      // Ajustar dimensiones del Canvas
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        for (const landmarks of results.multiHandLandmarks) {
          drawHandMesh(landmarks);
          analyzeSign(landmarks);
        }
      } else {
        camStatus.innerText = "BUSCANDO MANOS EN LA CÁMARA...";
      }
      canvasCtx.restore();
    }

    // Dibujar puntos de articulación sobre la mano del usuario
    function drawHandMesh(landmarks) {
      canvasCtx.fillStyle = '#10b981';
      for (const point of landmarks) {
        const x = point.x * canvasElement.width;
        const y = point.y * canvasElement.height;
        canvasCtx.beginPath();
        canvasCtx.arc(x, y, 4, 0, 2 * Math.PI);
        canvasCtx.fill();
      }
    }

    // Algoritmo de detección básica de gestos
    function analyzeSign(landmarks) {
      const thumbTip = landmarks[4];
      const indexTip = landmarks[8];
      const wrist = landmarks[0];

      // Detección de mano levantada
      if (indexTip.y < wrist.y - 0.2) {
        camStatus.innerText = 'SEÑA DETECTADA: "HOLA / MANO LEVANTADA"';
        // Respuesta automática del avatar cuando detects la seña
        playAnimation('hola');
      } else {
        camStatus.innerText = "MANO DETECTADA (ANALIZANDO GESTO...)";
      }
    }

    function onWindowResize() {
      const container = document.getElementById('avatar-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }
  </script>
</body>
</html>
