<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comunicador Inclusivo: Señas ↔ Avatar Humano y Voz</title>
  
  <!-- Three.js y GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  
  <!-- MediaPipe Hands & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 15px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    h1 { font-size: 1.3rem; display: flex; align-items: center; gap: 8px; }
    .badge-user {
      background: #1f6feb;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    
    .grid-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 15px;
    }
    @media (max-width: 850px) {
      .grid-container { grid-template-columns: 1fr; }
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
    }

    /* Panel Izquierdo */
    .video-box {
      position: relative;
      width: 100%;
      height: 240px;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    video, canvas.output-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .badge-lsm {
      position: absolute;
      top: 8px; right: 8px;
      background: #238636;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
      z-index: 5;
    }
    
    .banner-help {
      background: #0d419d;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }
    button {
      border: none;
      border-radius: 6px;
      padding: 8px 4px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.75rem;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    .btn-start { background: #238636; }
    .btn-audio { background: #1f6feb; }
    .btn-stop { background: #da3633; }
    
    .train-input {
      width: 100%;
      padding: 8px;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .btn-train {
      width: 100%;
      background: #238636;
      padding: 10px;
    }

    /* Panel Derecho Avatar */
    .avatar-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 8px;
    }
    #avatar-container {
      width: 100%;
      height: 380px;
      background: #05070a;
      border-radius: 6px;
      position: relative;
    }
    #avatar-container canvas {
      width: 100%!important;
      height: 100%!important;
    }
    
    .subtitle-banner {
      background: #05070a;
      border: 1px solid #30363d;
      border-radius: 6px;
      margin-top: 10px;
      padding: 12px;
      text-align: center;
      color: #3fb950;
      font-weight: bold;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>🖐️ Comunicador Inclusivo: Señas ⇆ Avatar Humano y Voz</h1>
    <div class="badge-user">H</div>
  </header>

  <div class="grid-container">
    <!-- PANEL ENTRADA DE SEÑAS -->
    <div class="card">
      <h3 style="font-size: 0.9rem; margin-bottom: 8px;">1. ENTRADA DE SEÑAS (PERSONA SORDA)</h3>
      <div class="video-box">
        <span class="badge-lsm">• LSM / GESTOS</span>
        <video id="input-video" playsinline></video>
        <canvas class="output-canvas" id="output-canvas"></canvas>
      </div>

      <div class="banner-help" id="status-sign">AYUDA (Detectando...)</div>

      <div class="btn-group">
        <button class="btn-start" onclick="startCamera()">INICIAR CÁMARA</button>
        <button class="btn-audio" id="btn-audio-toggle" onclick="toggleAudio()">AUDIO AUTO: ON</button>
        <button class="btn-stop" onclick="stopCamera()">DETENER</button>
      </div>

      <input type="text" id="new-sign-name" class="train-input" placeholder="Nombre de nueva seña..." />
      <button class="btn-train" onclick="trainCurrentSign()">ENTRENAR SEÑA ACTUAL ➕</button>
    </div>

    <!-- PANEL TRADUCTOR Y AVATAR 3D -->
    <div class="card">
      <div class="avatar-header">
        <span>2. TRADUCTOR A AVATAR HUMANO (PARA PERSONA SORDA)</span>
        <span>🌐 IDIOMA SEÑAS: LSM / INTERNATIONAL</span>
      </div>
      
      <div id="avatar-container"></div>

      <div class="subtitle-banner" id="subtitle-text">
        AVATAR INTERPRETANDO: ¡HOLA VÍCTOR! ¿CÓMO ESTÁS?
      </div>
    </div>
  </div>

  <script>
    // --- ESTADOS Y VARIABLES GLOBALES ---
    let camera = null;
    let autoAudio = true;
    let scene, camera3D, renderer, avatarGroup, headMesh, leftArmMesh, rightArmMesh;
    let isSpeaking = false;

    // --- 1. AUDITORÍA Y INICIALIZACIÓN DEL AVATAR 3D (THREE.JS RESILIENTE) ---
    function initAvatar3D() {
      const container = document.getElementById('avatar-container');
      const width = container.clientWidth;
      const height = container.clientHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05070a);

      camera3D = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera3D.position.set(0, 1.4, 2.5);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // Luces
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(0, 10, 10);
      scene.add(dirLight);

      // Intentar cargar modelo GLB externo o usar Fallback Procedimental Integrado
      const loader = new THREE.GLTFLoader();
      // URL accesible
      const avatarURL = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/RobotExpressive/glTF-Binary/RobotExpressive.glb';

      loader.load(
        avatarURL,
        (gltf) => {
          const model = gltf.scene;
          model.position.set(0, -0.8, 0);
          model.scale.set(0.3, 0.3, 0.3);
          scene.add(model);
        },
        undefined,
        (error) => {
          console.warn("Fallo la carga del modelo 3D externo. Activando Avatar Procedimental Local.");
          buildProceduralAvatar();
        }
      );

      // Listener para ajustar tamaño en reescalado de ventana
      window.addEventListener('resize', () => {
        if(!container) return;
        const w = container.clientWidth;
        const h = container.clientHeight;
        camera3D.aspect = w / h;
        camera3D.updateProjectionMatrix();
        renderer.setSize(w, h);
      });

      animate3D();
    }

    // Avatar 3D de respaldo (evita que aparezca "Error cargando Avatar 3D")
    function buildProceduralAvatar() {
      avatarGroup = new THREE.Group();

      // Torso
      const torsoGeo = new THREE.CylinderGeometry(0.25, 0.2, 0.7, 16);
      const skinMat = new THREE.MeshPhongMaterial({ color: 0x2b5b84 });
      const torso = new THREE.Mesh(torsoGeo, skinMat);
      torso.position.y = 0.35;
      avatarGroup.add(torso);

      // Cabeza
      const headGeo = new THREE.SphereGeometry(0.18, 32, 32);
      const faceMat = new THREE.MeshPhongMaterial({ color: 0xffdbac });
      headMesh = new THREE.Mesh(headGeo, faceMat);
      headMesh.position.y = 0.85;
      avatarGroup.add(headMesh);

      // Ojos
      const eyeGeo = new THREE.SphereGeometry(0.025, 16, 16);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
      eyeL.position.set(-0.06, 0.88, 0.16);
      const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
      eyeR.position.set(0.06, 0.88, 0.16);
      avatarGroup.add(eyeL);
      avatarGroup.add(eyeR);

      // Brazos
      const armGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.5, 16);
      leftArmMesh = new THREE.Mesh(armGeo, skinMat);
      leftArmMesh.position.set(-0.32, 0.45, 0);
      leftArmMesh.rotation.z = Math.PI / 6;

      rightArmMesh = new THREE.Mesh(armGeo, skinMat);
      rightArmMesh.position.set(0.32, 0.45, 0);
      rightArmMesh.rotation.z = -Math.PI / 6;

      avatarGroup.add(leftArmMesh);
      avatarGroup.add(rightArmMesh);

      avatarGroup.position.y = -0.2;
      scene.add(avatarGroup);
    }

    function animate3D() {
      requestAnimationFrame(animate3D);
      const time = Date.now() * 0.003;

      // Animación suave de respiración e interpretación gestual
      if (avatarGroup) {
        avatarGroup.position.y = -0.2 + Math.sin(time) * 0.01;
        if (leftArmMesh && rightArmMesh) {
          leftArmMesh.rotation.x = Math.sin(time * 2) * 0.2;
          rightArmMesh.rotation.x = -Math.sin(time * 2) * 0.2;
        }
      }
      renderer.render(scene, camera3D);
    }

    // --- 2. AUDITORÍA Y MANEJO DE MEDIAPIPE HANDS ---
    const videoElement = document.getElementById('input-video');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResultsHands);

    function onResultsHands(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        for (const landmarks of results.multiHandLandmarks) {
          drawHandLandmarks(landmarks);
        }
        document.getElementById('status-sign').innerText = "SEÑA DETECTADA: AYUDA";
      } else {
        document.getElementById('status-sign').innerText = "ESPERANDO SEÑA...";
      }
      canvasCtx.restore();
    }

    function drawHandLandmarks(landmarks) {
      canvasCtx.fillStyle = '#00FF00';
      canvasCtx.strokeStyle = '#FFFFFF';
      canvasCtx.lineWidth = 2;

      for (let point of landmarks) {
        const x = point.x * canvasElement.width;
        const y = point.y * canvasElement.height;
        canvasCtx.beginPath();
        canvasCtx.arc(x, y, 4, 0, 2 * Math.PI);
        canvasCtx.fill();
      }
    }

    // --- 3. CONTROLES DE CÁMARA Y VOZ ---
    function startCamera() {
      if (!camera) {
        camera = new Camera(videoElement, {
          onFrame: async () => {
            await hands.send({ image: videoElement });
          },
          width: 640,
          height: 480
        });
      }
      camera.start();
      speakText("Cámara iniciada. Listo para detectar señas.");
    }

    function stopCamera() {
      if (camera) {
        camera.stop();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        document.getElementById('status-sign').innerText = "CÁMARA DETENIDA";
      }
    }

    function toggleAudio() {
      autoAudio = !autoAudio;
      const btn = document.getElementById('btn-audio-toggle');
      btn.innerText = autoAudio ? "AUDIO AUTO: ON" : "AUDIO AUTO: OFF";
      btn.style.background = autoAudio ? "#1f6feb" : "#6e7681";
    }

    function speakText(text) {
      if (!autoAudio || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';
      window.speechSynthesis.speak(utterance);
    }

    function trainCurrentSign() {
      const input = document.getElementById('new-sign-name');
      const val = input.value.trim();
      if (val) {
        alert(`Seña "${val}" registrada correctamente.`);
        input.value = '';
      } else {
        alert("Por favor introduce un nombre para la nueva seña.");
      }
    }

    // Inicializar Render 3D al cargar la página
    window.onload = () => {
      initAvatar3D();
    };
  </script>
</body>
</html>
